<svg width="1280" height="420" viewBox="0 0 1280 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">sbox-agent-bridge banner</title>
  <desc id="desc">A dark technical banner for sbox-agent-bridge: live s&amp;box editor automation through MCP.</desc>
  <defs>
    <radialGradient id="g1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(985 95) rotate(139) scale(560 360)">
      <stop stop-color="#7D5CFF" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#284CFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#050509" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(280 360) rotate(-29) scale(500 260)">
      <stop stop-color="#7CFFB2" stop-opacity="0.36"/>
      <stop offset="0.55" stop-color="#7CFFB2" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#050509" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bridge" x1="665" y1="217" x2="1185" y2="217" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7CFFB2"/>
      <stop offset="0.45" stop-color="#7AA7FF"/>
      <stop offset="1" stop-color="#B98CFF"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-80%" width="160%" height="260%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.35 0 0 0 0 0.55 0 0 0 0 1 0 0 0 0.65 0"/>
      <feBlend in="SourceGraphic" mode="screen"/>
    </filter>
  </defs>
  <rect width="1280" height="420" rx="34" fill="#050509"/>
  <rect width="1280" height="420" rx="34" fill="url(#g1)"/>
  <rect width="1280" height="420" rx="34" fill="url(#g2)"/>
  <path d="M0 74H1280M0 148H1280M0 222H1280M0 296H1280M0 370H1280M94 0V420M188 0V420M282 0V420M376 0V420M470 0V420M564 0V420M658 0V420M752 0V420M846 0V420M940 0V420M1034 0V420M1128 0V420M1222 0V420" stroke="white" stroke-opacity="0.035"/>

  <text x="80" y="122" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="24" font-weight="650" letter-spacing="4" fill="#7CFFB2">SBOX AGENT BRIDGE</text>
  <text x="78" y="200" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="58" font-weight="750" letter-spacing="-2" fill="#F7F8FF">Give agents hands in</text>
  <text x="78" y="266" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="58" font-weight="750" letter-spacing="-2" fill="#F7F8FF">the s&amp;box editor.</text>
  <text x="82" y="318" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="22" font-weight="430" fill="#B7C0D8">Inspect scenes, make undoable edits, run play mode, and read back what actually happened.</text>

  <rect x="82" y="342" width="120" height="36" rx="18" fill="white" fill-opacity="0.07" stroke="white" stroke-opacity="0.12"/>
  <text x="142" y="365" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" fill="#DDE7FF">MCP</text>
  <rect x="214" y="342" width="164" height="36" rx="18" fill="white" fill-opacity="0.07" stroke="white" stroke-opacity="0.12"/>
  <text x="296" y="365" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" fill="#DDE7FF">s&amp;box editor</text>
  <rect x="390" y="342" width="170" height="36" rx="18" fill="white" fill-opacity="0.07" stroke="white" stroke-opacity="0.12"/>
  <text x="475" y="365" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" fill="#DDE7FF">verified edits</text>

  <path d="M680 220C742 120 820 120 884 220C948 320 1030 320 1180 150" stroke="url(#bridge)" stroke-width="20" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M680 220C742 120 820 120 884 220C948 320 1030 320 1180 150" stroke="white" stroke-opacity="0.34" stroke-width="3" stroke-linecap="round"/>

