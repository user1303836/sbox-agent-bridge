<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">sbox-agent-bridge logo</title>
  <desc id="desc">A neon bridge connecting an AI node to an s&amp;box editor cube.</desc>
  <defs>
    <linearGradient id="bg" x1="24" y1="24" x2="232" y2="232" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1020"/>
      <stop offset="0.54" stop-color="#12122A"/>
      <stop offset="1" stop-color="#050509"/>
    </linearGradient>
    <linearGradient id="bridge" x1="48" y1="132" x2="208" y2="132" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7CFFB2"/>
      <stop offset="0.48" stop-color="#7AA7FF"/>
      <stop offset="1" stop-color="#B98CFF"/>
    </linearGradient>
    <linearGradient id="cube" x1="138" y1="64" x2="208" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E9F1FF"/>
      <stop offset="1" stop-color="#7AA7FF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.45 0 0 0 0 0.65 0 0 0 0 1 0 0 0 0.65 0"/>
      <feBlend in="SourceGraphic" mode="screen"/>
    </filter>
  </defs>
  <rect x="16" y="16" width="224" height="224" rx="48" fill="url(#bg)"/>
  <rect x="16.75" y="16.75" width="222.5" height="222.5" rx="47.25" stroke="white" stroke-opacity="0.12" stroke-width="1.5"/>

  <path d="M54 132C74 100 98 100 118 132C138 164 162 164 202 112" stroke="url(#bridge)" stroke-width="13" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M54 132C74 100 98 100 118 132C138 164 162 164 202 112" stroke="white" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round"/>

  <circle cx="58" cy="132" r="22" fill="#101827" stroke="#7CFFB2" stroke-width="5"/>
  <circle cx="58" cy="132" r="7" fill="#7CFFB2"/>
  <path d="M44 102L58 78L72 102" stroke="#7CFFB2" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M58 78V110" stroke="#7CFFB2" stroke-width="7" stroke-linecap="round"/>

  <path d="M160 70L204 94V144L160 168L116 144V94L160 70Z" fill="#111827" stroke="#E9F1FF" stroke-opacity="0.22" stroke-width="2"/>
  <path d="M160 70L204 94L160 118L116 94L160 70Z" fill="url(#cube)"/>
  <path d="M116 94L160 118V168L116 144V94Z" fill="#4569B3"/>
